# raw = "dbt_studio_academy". Named my Catalog as "dbt_studio_academy" in Databricks.

sources:
  - name: jaffle_shop
    description: A clone of a Postgres application database
    database: dbt_studio_academy  
    schema: jaffle_shop  
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: Primary key for customer data
            data_tests:
              - unique
              - not_null        
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: Primary key for orders datay
            data_tests:
              - unique
              - not_null       
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after: 
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at

